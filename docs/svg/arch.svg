<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect width="980" height="470" fill="#ffffff"/>
  <!-- zones -->
  <rect x="215" y="20" width="520" height="300" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="235" y="46" font-weight="bold" fill="#1d4ed8">本機 Docker Compose:同一個 Postgres,用 schema 分三層</text>
  <rect x="765" y="20" width="195" height="300" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="785" y="46" font-weight="bold" fill="#15803d">雲端 Neon(M5)</text>
  <!-- source -->
  <rect x="20" y="120" width="170" height="100" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="105" y="152" text-anchor="middle" font-weight="bold">維基百科 API</text>
  <text x="105" y="174" text-anchor="middle" font-size="12">中文版「最近變更」</text>
  <text x="105" y="194" text-anchor="middle" font-size="12">只保留最近 30 天</text>
  <!-- local boxes -->
  <rect x="235" y="120" width="140" height="100" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
  <text x="305" y="152" text-anchor="middle" font-weight="bold">raw 原始層</text>
  <text x="305" y="174" text-anchor="middle" font-size="12">JSONB 原樣收下</text>
  <text x="305" y="194" text-anchor="middle" font-size="12">永不刪除</text>
  <rect x="400" y="120" width="140" height="100" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
  <text x="470" y="152" text-anchor="middle" font-weight="bold">staging 整理層</text>
  <text x="470" y="174" text-anchor="middle" font-size="12">拆欄位、去重</text>
  <text x="470" y="194" text-anchor="middle" font-size="12">分出編輯與改名</text>
  <rect x="565" y="70" width="150" height="150" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
  <text x="640" y="98" text-anchor="middle" font-weight="bold">warehouse 倉儲層</text>
  <text x="640" y="122" text-anchor="middle" font-size="12">fact_edit</text>
  <text x="640" y="142" text-anchor="middle" font-size="12">fact_page_daily</text>
  <text x="640" y="162" text-anchor="middle" font-size="12">dim_page(SCD2)</text>
  <text x="640" y="182" text-anchor="middle" font-size="12">dim_user、dim_date</text>
  <text x="640" y="202" text-anchor="middle" font-size="12">dim_wiki</text>
  <rect x="565" y="245" width="150" height="60" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
  <text x="640" y="272" text-anchor="middle" font-weight="bold">dq_results</text>
  <text x="640" y="292" text-anchor="middle" font-size="12">每次檢查的成績單</text>
  <!-- cloud box -->
  <rect x="785" y="100" width="155" height="100" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2"/>
  <text x="862" y="132" text-anchor="middle" font-weight="bold">倉儲層的副本</text>
  <text x="862" y="154" text-anchor="middle" font-size="12">每日發布一份</text>
  <text x="862" y="174" text-anchor="middle" font-size="12">供外部連線查詢</text>
  <!-- arrows -->
  <path d="M190 170H233" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M375 170H398" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M540 170H563" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M470 220V275H563" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M715 150H783" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="749" y="140" text-anchor="middle" font-size="11" fill="#475569">發布</text>
  <!-- airflow -->
  <rect x="20" y="345" width="940" height="46" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="40" y="373" font-weight="bold">Airflow 每小時 DAG:</text>
  <text x="195" y="373">向 API 抓該小時 → 寫入 raw(重跑不重複)→ 整理到 staging → 小時級品質檢查</text>
  <rect x="20" y="403" width="940" height="46" rx="10" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="40" y="431" font-weight="bold">Airflow 每日 DAG:</text>
  <text x="195" y="431">先更新 dim_page(SCD2)與 dim_user → 再載兩張事實表 → 品質檢查 → 發布到雲端(依日序)</text>
</svg>
