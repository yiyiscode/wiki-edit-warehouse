<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="14">
  <rect width="900" height="430" fill="#ffffff"/>
  <g stroke="#94a3b8" stroke-width="2">
    <path d="M450 150L200 70"/><path d="M450 150L700 70"/><path d="M450 150L200 240"/><path d="M450 150L700 240"/>
    <path d="M330 340H55V70H90" fill="none" stroke-dasharray="5 4"/><path d="M570 340H845V70H810" fill="none" stroke-dasharray="5 4"/><path d="M540 300L650 270" stroke-dasharray="5 4"/>
  </g>
  <!-- facts -->
  <rect x="330" y="110" width="240" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="142" text-anchor="middle" font-weight="bold">fact_edit</text>
  <text x="450" y="164" text-anchor="middle" font-size="12">一筆 = 一次編輯或一次新建頁面</text>
  <text x="450" y="182" text-anchor="middle" font-size="12">像「收銀機流水帳」;含機器人標記</text>
  <rect x="330" y="300" width="240" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="332" text-anchor="middle" font-weight="bold">fact_page_daily</text>
  <text x="450" y="354" text-anchor="middle" font-size="12">一筆 = 一個頁面 × 一天(當天有編輯才記)</text>
  <text x="450" y="372" text-anchor="middle" font-size="12">像「打烊盤點有動過的貨架」</text>
  <!-- dims -->
  <rect x="90" y="40" width="220" height="60" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="200" y="68" text-anchor="middle" font-weight="bold">dim_page(SCD2)</text>
  <text x="200" y="88" text-anchor="middle" font-size="12">頁面名片:標題、命名空間,留歷史</text>
  <rect x="590" y="40" width="220" height="60" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="700" y="68" text-anchor="middle" font-weight="bold">dim_date</text>
  <text x="700" y="88" text-anchor="middle" font-size="12">日曆:週幾、第幾週、月份</text>
  <rect x="90" y="210" width="220" height="60" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="200" y="238" text-anchor="middle" font-weight="bold">dim_user(SCD1)</text>
  <text x="200" y="258" text-anchor="middle" font-size="12">使用者,改名就覆蓋;匿名共用一列</text>
  <rect x="590" y="210" width="220" height="60" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="700" y="238" text-anchor="middle" font-weight="bold">dim_wiki</text>
  <text x="700" y="258" text-anchor="middle" font-size="12">哪個維基(目前只有中文版)</text>
  <text x="20" y="410" font-size="12" fill="#64748b">實線 = fact_edit 的連線(四張維度);虛線 = fact_page_daily 的連線(dim_page、dim_date、dim_wiki)</text>
</svg>
